<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PVA Entrevista — Cortes: Consórcio Sem Juros</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #070b0d;
      color: #f3f4f6;
      line-height: 1.5;
    }
    a { text-decoration: none; color: inherit; }
    button { font-family: inherit; cursor: pointer; border: none; }
    .container { max-width: 1140px; width: 100%; margin: 0 auto; padding: 0 20px; }

    header {
      background: linear-gradient(180deg, #000000 0%, #04161a 70%, #070b0d 100%);
      border-bottom: 1px solid rgba(255,255,255,0.12);
      padding: 28px 0 34px;
    }
    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      gap: 12px;
      flex-wrap: wrap;
    }
    .back-link {
      font-size: 13px;
      font-weight: 700;
      color: #ffd600;
      background: rgba(255,214,0,0.1);
      border: 1px solid rgba(255,214,0,0.3);
      padding: 7px 14px;
      border-radius: 10px;
    }
    .back-link:hover { background: rgba(255,214,0,0.2); }
    .btn-full-yt {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.18);
      padding: 8px 16px;
      border-radius: 10px;
    }
    .btn-full-yt:hover { background: rgba(255,255,255,0.18); }

    .header-main { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
    .logo-box {
      background: #000;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 16px;
      padding: 12px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .logo-pva { font-family: Georgia, serif; font-size: 24px; font-weight: 800; color: #fff; letter-spacing: 2px; line-height: 1; margin-top: 4px; }
    .logo-sub { font-size: 9px; font-weight: 700; letter-spacing: 3px; color: rgba(255,255,255,0.85); margin-top: 4px; }
    .badge-ep {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      background: rgba(16, 185, 129, 0.15);
      color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.35);
      margin-bottom: 6px;
    }
    h1 { font-size: 26px; font-weight: 800; color: #fff; line-height: 1.25; }
    h1 span { color: #ffd600; }
    .guests { font-size: 14px; color: #d1d5db; margin-top: 6px; }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      margin-top: 24px;
    }
    .kpi-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 14px 16px;
    }
    .kpi-label { font-size: 12px; color: #9ca3af; }
    .kpi-val { font-size: 19px; font-weight: 800; color: #ffd600; margin: 2px 0; }
    .kpi-val.emerald { color: #10b981; }
    .kpi-val.white { color: #fff; }
    .kpi-sub { font-size: 11px; color: #9ca3af; }

    main { padding: 32px 0 48px; }
    section { margin-bottom: 36px; }

    .player-box {
      background: #04161a;
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 20px 45px rgba(0,0,0,0.65);
    }
    .video-wrap { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; }
    .video-wrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    .player-bar {
      padding: 18px 20px;
      background: rgba(0,0,0,0.75);
      border-top: 1px solid rgba(255,255,255,0.1);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .tags-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 6px; }
    .tag-time { background: #10b981; color: #000; font-size: 12px; font-weight: 800; padding: 3px 10px; border-radius: 6px; }
    .tag-cat { background: rgba(255,255,255,0.1); color: #ffd600; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 6px; }
    .tag-count { font-size: 12px; color: #9ca3af; }
    .active-title { font-size: 19px; font-weight: 800; color: #fff; }
    .active-speaker { font-size: 12px; color: #9ca3af; margin-top: 3px; }
    .controls-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .btn-ctrl { background: rgba(255,255,255,0.1); color: #fff; font-size: 12px; font-weight: 700; padding: 9px 14px; border-radius: 10px; }
    .btn-ctrl:hover { background: rgba(255,255,255,0.18); }
    .btn-yt-open { background: #ffd600; color: #000; font-size: 12px; font-weight: 800; padding: 9px 16px; border-radius: 10px; }
    .btn-yt-open:hover { background: #fde047; }

    .sec-kicker { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; color: #10b981; }
    .sec-title { font-size: 20px; font-weight: 800; color: #fff; margin-bottom: 16px; }
    .highlights-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
    .hl-btn {
      text-align: left;
      padding: 16px;
      border-radius: 14px;
      background: linear-gradient(135deg, #04161a 0%, #06090b 100%);
      border: 1px solid rgba(255,255,255,0.12);
      color: #fff;
      transition: border-color 0.2s;
    }
    .hl-btn:hover { border-color: #ffd600; }
    .hl-top { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 8px; }
    .hl-time { background: rgba(16,185,129,0.2); color: #10b981; font-weight: 800; padding: 2px 8px; border-radius: 5px; }
    .hl-play { color: #ffd600; font-weight: 700; }
    .hl-title { font-size: 14px; font-weight: 700; line-height: 1.35; }

    .filter-box {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 18px;
    }
    .filter-inputs { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
    .search-input {
      flex: 1;
      min-width: 240px;
      padding: 11px 14px;
      border-radius: 10px;
      background: #000;
      border: 1px solid rgba(255,255,255,0.18);
      color: #fff;
      font-size: 14px;
    }
    .search-input:focus { outline: none; border-color: #ffd600; }
    .speaker-select {
      padding: 11px 14px;
      border-radius: 10px;
      background: #000;
      border: 1px solid rgba(255,255,255,0.18);
      color: #fff;
      font-size: 14px;
    }
    .tabs-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .tab-btn {
      padding: 7px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      background: rgba(255,255,255,0.06);
      color: #d1d5db;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .tab-btn.active { background: #ffd600; color: #000; border-color: #ffd600; }

    .cuts-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
    .count-pill { font-size: 12px; font-weight: 700; padding: 5px 12px; border-radius: 999px; background: rgba(255,255,255,0.1); color: #ffd600; }
    .cuts-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }

    .cut-card {
      background: linear-gradient(180deg, #04161a 0%, #05080a 100%);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s, border-color 0.2s;
    }
    .cut-card:hover { transform: translateY(-3px); border-color: #ffd600; }
    .cut-card.is-playing { border: 2px solid #10b981; }

    .cut-banner {
      position: relative;
      height: 112px;
      background: linear-gradient(90deg, #06242b 0%, #0a3640 50%, #04161a 100%);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .cut-icon-box {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      background: rgba(0,0,0,0.55);
      border: 1px solid rgba(255,214,0,0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffd600;
      font-weight: 800;
    }
    .play-round {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #ffd600;
      color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 15px;
    }
    .banner-time {
      position: absolute;
      bottom: 8px;
      right: 12px;
      background: rgba(0,0,0,0.82);
      color: #10b981;
      border: 1px solid rgba(16,185,129,0.4);
      font-size: 11px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 5px;
    }
    .cut-body { padding: 18px 20px 10px; }
    .cut-title { font-size: 16px; font-weight: 800; color: #fff; margin-bottom: 8px; line-height: 1.35; }
    .cut-summary { font-size: 13px; color: #d1d5db; }
    .cut-foot { padding: 12px 20px 18px; }
    .cut-speakers { font-size: 11px; color: #9ca3af; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 10px; margin-bottom: 10px; }
    .cut-actions { display: flex; gap: 8px; }
    .btn-watch { flex: 1; background: #ffd600; color: #000; font-size: 12px; font-weight: 800; padding: 10px; border-radius: 10px; text-align: center; }
    .btn-watch:hover { background: #fde047; }
    .btn-yt-small { background: rgba(255,255,255,0.1); color: #fff; font-size: 12px; font-weight: 700; padding: 10px 12px; border-radius: 10px; }

    .table-box {
